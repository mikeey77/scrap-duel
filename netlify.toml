# The game source lives in src/ (css + js split by feature); `node build.mjs` bundles it
# into the single static page site/index.html. Server code: the account API and the lobby
# (players online + public rooms), both in netlify/functions and stored in Netlify Blobs.
[build]
  command = "node build.mjs"
  publish = "site"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
