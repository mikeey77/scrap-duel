# Builds the Windows installer and zip on a real Windows machine and publishes them as a GitHub Release.
# It runs when main changes and the version in package.json has no release yet, so a release is just:
# bump "version", add a section to CHANGELOG.md, push to main. "Run workflow" in the Actions tab works too.
name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      exists: ${{ steps.v.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(node -p "require('./package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"; echo "v$v is already released"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
  windows:
    needs: check
    if: needs.check.outputs.exists == 'false'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx electron-builder --win nsis zip --x64 --publish never
      - name: Release notes from CHANGELOG.md
        shell: bash
        run: |
          v="${{ needs.check.outputs.version }}"
          awk -v v="$v" '/^## /{p = index($0, "## " v) == 1; next} p' CHANGELOG.md > notes.md
          printf '\n**Install:** download `ScrapDuel-Setup.exe` and run it. If Windows says it protected your PC, click *More info* and then *Run anyway*.\n' >> notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Scrap Duel ${{ needs.check.outputs.version }}
          body_path: notes.md
          files: |
            dist/ScrapDuel-Setup.exe
            dist/ScrapDuel-Windows.zip
